<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>광주광역시 버스 노선 지도 (OpenStreetMap)</title>
  <meta name="description" content="OpenStreetMap 기반 광주광역시 시내버스 노선 및 정류장 실시간 검색 및 지도 뷰어">

  <!-- Fonts: Pretendard & Inter -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Cache-Control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css?v=20261019_1355">
</head>
<body>
  <div id="app" class="app-layout">
    
    <!-- Top Floating Header / Search Bar -->
    <header class="top-nav">
      <div class="logo-area">
        <div class="logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="15" rx="3"></rect>
            <path d="M7 18v2"></path>
            <path d="M17 18v2"></path>
            <circle cx="7.5" cy="13.5" r="1.5"></circle>
            <circle cx="16.5" cy="13.5" r="1.5"></circle>
            <path d="M3 9h18"></path>
          </svg>
        </div>
        <div class="logo-text">
          <h1>광주 버스 노선도</h1>
          <span class="badge-osm">OpenStreetMap</span>
        </div>
      </div>

      <!-- Main Search Box -->
      <div class="search-container">
        <!-- 1. 노선 정류소 검색창 영역 -->
        <div id="routeSearchWrapper" class="route-search-wrapper">
          <span class="search-section-label">노선 정류소 검색</span>
          <div class="search-input-wrapper">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              id="routeSearchInput" 
              placeholder="노선명, 정류소명 또는 ARS 번호 검색 (예: 급행03, 광천터미널, 2002)" 
              autocomplete="off" 
              spellcheck="false"
            />
            <button id="clearSearchBtn" class="clear-btn" title="검색어 지우기" aria-label="검색어 초기화">✕</button>
          </div>
          <!-- 1. 노선 정류소 검색 실행 버튼 (문구: '검색') -->
          <button class="nav-btn-search" id="btnRouteSearchSubmit" title="노선 및 정류소 검색">
            <span>검색</span>
          </button>
          <!-- 2. 길찾기 모드 전환 버튼 -->
          <button class="nav-switch-btn path" id="btnGoToPath" title="길찾기 화면으로 전환">
            <span>길찾기</span>
          </button>
        </div>

        <!-- 2. 길찾기 기능 영역 (출발/도착 변경 아이콘 오른쪽에는 오직 길찾기 버튼만 배치) -->
        <div id="pathSearchWrapper" class="path-search-wrapper hidden">
          <button class="path-close-btn" id="btnBackToRouteSearch" title="길찾기 닫기 (노선 정류소 검색으로 돌아가기)">✕</button>
          <div class="path-inputs-group">
            <div class="path-input-row">
              <span class="path-pin-badge start">출발</span>
              <input 
                type="text" 
                id="pathStartInput" 
                placeholder="출발 정류소명 또는 ARS 검색..." 
                autocomplete="off" 
                spellcheck="false"
              />
              <button id="clearStartBtn" class="clear-btn sub" title="지우기">✕</button>
            </div>
            <div class="path-input-row">
              <span class="path-pin-badge end">도착</span>
              <input 
                type="text" 
                id="pathEndInput" 
                placeholder="도착 정류소명 또는 ARS 검색..." 
                autocomplete="off" 
                spellcheck="false"
              />
              <button id="clearEndBtn" class="clear-btn sub" title="지우기">✕</button>
            </div>
          </div>
          <!-- 출발 도착 변경 아이콘 -->
          <button id="pathSwapBtn" class="path-swap-btn" title="출발/도착 바꾸기" aria-label="출발/도착 교환">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"></path>
            </svg>
          </button>
          <!-- 출발 도착 변경 아이콘 오른쪽에는 길찾기 버튼 이외 제거 완료 -->
          <button id="pathSearchSubmitBtn" class="path-submit-btn" title="경로 검색">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>길찾기</span>
          </button>
        </div>

        <!-- Autocomplete Suggestions Dropdown -->
        <div id="searchResultsDropdown" class="search-dropdown hidden"></div>
      </div>

      <!-- Top Actions -->
      <div class="header-actions">
        <!-- Map Layer Toggle Button -->
        <button id="layerMenuToggleBtn" class="icon-btn" title="지도 스타일 변경" aria-label="지도 스타일">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </button>

        <!-- Sidebar Toggle Button for Mobile -->
        <button id="sidebarToggleBtn" class="icon-btn sidebar-toggle-btn" title="정보 패널 열기/닫기" aria-label="사이드바 열기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Map Tile & View Settings Overlay Menu -->
    <div id="mapSettingsMenu" class="map-settings-menu hidden">
      <div class="menu-header">
        <h4>지도 설정</h4>
        <button id="closeSettingsBtn" class="close-btn">✕</button>
      </div>
      <div class="menu-section">
        <label class="section-label">배경 지도 (OpenStreetMap / Carto)</label>
        <div class="tile-options">
          <button class="tile-opt active" data-tile="osm">기본 OSM</button>
          <button class="tile-opt" data-tile="carto-light">깔끔한 밝은 지도</button>
          <button class="tile-opt" data-tile="carto-dark">다크 모드 지도</button>
          <button class="tile-opt" data-tile="humanitarian">Humanitarian OSM</button>
        </div>
      </div>
      <div class="menu-section">
        <label class="section-label">정류소/경유지 표시</label>
        <label class="checkbox-row">
          <input type="checkbox" id="chkShowStops" checked>
          <span>승하차 정류소 마커 표시</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="chkShowWaypoints" checked>
          <span>교차로 마커 표시 (도로 경유점)</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="chkShowLabels">
          <span>주요 정류소 이름 라벨 상시 표시</span>
        </label>
      </div>
      <div class="menu-section">
        <button id="btnExportGeoJSON" class="btn-secondary full-width">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          현재 노선 GeoJSON 내보내기
        </button>
      </div>
    </div>

    <!-- Main Workspace: Map Container + Left Sidebar -->
    <main class="main-content">
      
      <!-- Leaflet Map Container -->
      <div id="map" class="map-container"></div>

      <!-- Floating Map Control Buttons -->
      <div class="map-floating-controls">
        <button id="btnZoomIn" class="map-ctrl-btn" title="확대">+</button>
        <button id="btnZoomOut" class="map-ctrl-btn" title="축소">−</button>
        <button id="btnResetGwangju" class="map-ctrl-btn" title="광주광역시 전체 보기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        <button id="btnFitRoute" class="map-ctrl-btn" title="선택 노선 전체 맞춤">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>

      <!-- Mobile Floating Route Summary Bar (노선 검색 시 지도를 우선 표출하고 상세 정보를 볼 수 있는 플로팅 바) -->
      <div id="mobileRouteSheetBar" class="mobile-route-sheet-bar hidden">
        <div class="mrs-info">
          <span class="mrs-badge" id="mrsBadge">급행</span>
          <div class="mrs-texts">
            <div class="mrs-title" id="mrsTitle">급행03</div>
            <div class="mrs-sub" id="mrsSub">첨단공영차고지 ⇄ 첨단공영차고지</div>
          </div>
        </div>
        <button id="btnOpenRouteSheet" class="mrs-open-btn" title="정류소 목록 및 노선 정보 보기">
          <span>정류소 목록 ▲</span>
        </button>
      </div>

      <!-- Sidebar: Route Detail & Stop Sequence -->
      <aside id="sidebar" class="sidebar">
        
        <!-- Welcome / Route List Panel (Default when no route selected) -->
        <div id="panelRouteList" class="sidebar-panel">
          <div class="panel-header">
            <h3>노선 목록</h3>
            <span class="route-count-badge" id="totalRoutesBadge">120개 노선</span>
          </div>

          <!-- Route Category Filters -->
          <div class="category-filter-chips">
            <button class="cat-chip active" data-cat="all">전체</button>
            <button class="cat-chip" data-cat="급행">급행</button>
            <button class="cat-chip" data-cat="간선">간선</button>
            <button class="cat-chip" data-cat="지선">지선</button>
            <button class="cat-chip" data-cat="순환">순환</button>
            <button class="cat-chip" data-cat="맞춤">기타/맞춤</button>
          </div>

          <!-- Route Cards List -->
          <div class="route-card-list" id="routeCardList">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Selected Route Detail Panel -->
        <div id="panelRouteDetail" class="sidebar-panel hidden">
          <div class="panel-header-back">
            <button id="btnBackToRouteList" class="back-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              <span>목록으로</span>
            </button>
            <span class="panel-subtitle">노선 상세 정보</span>
            <button id="btnFoldRouteDetailMobile" class="mobile-map-view-btn" title="지도 전체 보기">
              <span>지도 보기 ▼</span>
            </button>
          </div>

          <!-- Route Hero Card -->
          <div class="route-hero-card" id="routeHeroCard">
            <div class="hero-top">
              <span class="route-type-tag" id="detailRouteType">급행</span>
              <h2 class="route-hero-name" id="detailRouteName">급행03</h2>
              <span class="route-id-tag" id="detailRouteId">ID 227</span>
            </div>
            <div class="hero-terminals">
              <div class="terminal-item">
                <span class="term-badge start">기점</span>
                <span class="term-name" id="detailStartStop">첨단공영차고지</span>
              </div>
              <div class="terminal-arrow">⇄</div>
              <div class="terminal-item">
                <span class="term-badge end">종점</span>
                <span class="term-name" id="detailEndStop">첨단공영차고지</span>
              </div>
            </div>
            <div class="turn-stop-info" id="detailTurnWrap">
              <span class="term-badge turn">회차</span>
              <span class="turn-name" id="detailTurnStop">조선대해오름관</span>
            </div>

            <!-- Stats Grid -->
            <div class="route-stats-grid">
              <div class="stat-box">
                <span class="stat-num" id="detailStopCount">0</span>
                <span class="stat-label">정류소</span>
              </div>
              <div class="stat-box">
                <span class="stat-num" id="detailLength">0.0</span>
                <span class="stat-label">거리 (km)</span>
              </div>
              <div class="stat-box">
                <span class="stat-num" id="detailPointCount">0</span>
                <span class="stat-label">교차로 수</span>
              </div>
            </div>


            <!-- Trajectory Status Indicator -->
            <div class="osrm-status-container" id="osrmStatusContainer">
              <div class="osrm-pulse-dot" id="osrmDot"></div>
              <span class="osrm-status-text" id="osrmStatusText">공식 도로망(BIS 궤적) 적용 완료</span>
              <span class="osrm-coords-count" id="osrmCoordsCount"></span>
            </div>
          </div>

          <!-- Direction Switch Tabs -->
          <div class="direction-tabs">
            <button class="dir-tab active" data-dir="all" id="tabDirAll">전체 경로</button>
            <button class="dir-tab" data-dir="상행" id="tabDirUp">상행 (기점방향)</button>
            <button class="dir-tab" data-dir="하행" id="tabDirDown">하행 (종점방향)</button>
          </div>

          <!-- Search within Stops -->
          <div class="stop-filter-box">
            <input type="text" id="stopFilterInput" placeholder="이 노선의 정류소명 / ARS 번호 검색..." />
          </div>

          <!-- Stops Timeline List -->
          <div class="stop-sequence-container" id="stopSequenceList">
            <!-- Dynamically populated transit timeline -->
          </div>
        </div>

        <!-- Reverse Stop Detail Panel (When searching by stop name) -->
        <div id="panelStopDetail" class="sidebar-panel hidden">
          <div class="panel-header-back">
            <button id="btnBackFromStop" class="back-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              <span>목록으로</span>
            </button>
            <span class="panel-subtitle">정류소 상세</span>
            <button id="btnFoldStopDetailMobile" class="mobile-map-view-btn" title="지도 전체 보기">
              <span>지도 보기 ▼</span>
            </button>
          </div>

          <div class="stop-hero-card">
            <div class="stop-icon-circle">🚏</div>
            <h2 id="stopDetailName" class="stop-title">정류소명</h2>
            <div class="stop-meta-badges">
              <span id="stopDetailArs" class="ars-tag">ARS: -</span>
              <span id="stopDetailCount" class="route-count-tag">0개 노선 경유</span>
            </div>
          </div>

          <div class="stop-routes-section">
            <h4>경유하는 버스 노선</h4>
            <div id="stopRoutesList" class="stop-routes-grid"></div>
          </div>
        </div>

        <!-- Path Search Results Panel (길찾기 결과) -->
        <div id="panelPathResult" class="sidebar-panel hidden">
          <div class="panel-header-back">
            <button id="btnBackFromPath" class="back-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              <span>목록으로</span>
            </button>
            <span class="panel-subtitle">길찾기 결과</span>
            <button id="btnFoldPathDetailMobile" class="mobile-map-view-btn" title="지도 전체 보기">
              <span>지도 보기 ▼</span>
            </button>
          </div>

          <!-- Path Query Summary Header -->
          <div class="path-summary-header">
            <div class="path-terminal-summary">
              <div class="term-point"><span class="point-dot start"></span><span id="summaryStartName" class="point-name">-</span></div>
              <div class="term-arrow">➔</div>
              <div class="term-point"><span class="point-dot end"></span><span id="summaryEndName" class="point-name">-</span></div>
            </div>
            <div class="path-filter-bar">
              <div class="path-sort-tabs">
                <button class="path-sort-tab active" data-sort="direct" id="sortDirectBtn">직통 우선</button>
                <button class="path-sort-tab" data-sort="stops" id="sortStopsBtn">최소 정류장</button>
              </div>
              <span id="pathResultsCount" class="path-count-badge">0개 경로</span>
            </div>
          </div>

          <!-- Path Results List Container -->
          <div id="pathResultsList" class="path-results-list">
            <!-- Dynamically populated path cards -->
          </div>
        </div>

      </aside>

    </main>

  </div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Bus Routes Data (Pre-processed JSON loaded as global variable) -->
  <script src="routes_data.js"></script>
  
  <!-- OSRM Pre-computed Cache -->
  <script src="osrm_cache.js"></script>
  
  <!-- Client-side Bus Router Engine -->
  <script src="router.js?v=20261019_1425"></script>
  
  <!-- Main Application Logic -->
  <script src="app.js?v=20261019_1425"></script>
</body>
</html>
