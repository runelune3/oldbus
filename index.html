<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>광주광역시 시내버스 노선·정류장 검색 (신규 도로망 궤적)</title>
  <meta name="description" content="광주광역시 시내버스 최신 노선 및 정류장 검색 서비스 - bus.gwangju.go.kr 공식 113개 전 노선 실제 도로 주행 궤적 100% 반영">

  <!-- Fonts: Pretendard & Inter -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Cache-Control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css?v=20261029_1500">
</head>
<body>
  <div id="app" class="app-layout">
    
    <!-- Top Floating Header / Search Bar -->
    <header class="top-nav">
      <div class="logo-area" id="btnLogoHome" title="처음 화면으로">
        <div class="logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="15" rx="3"></rect>
            <path d="M7 18v2"></path>
            <path d="M17 18v2"></path>
            <circle cx="7.5" cy="13.5" r="1.5"></circle>
            <circle cx="16.5" cy="13.5" r="1.5"></circle>
            <path d="M3 9h18"></path>
          </svg>
        </div>
        <div class="logo-text">
          <h1>광주 버스 노선·정류장</h1>
          <span class="badge-bis">BIS 공식 궤적</span>
        </div>
      </div>

      <!-- Main Search Container (노선 및 정류소/ARS 전용) -->
      <div class="search-container">
        <div id="routeSearchWrapper" class="route-search-wrapper">
          <div class="search-input-wrapper">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              id="routeSearchInput" 
              placeholder="노선명, 정류소명 또는 4자리 ARS 검색 (예: 순환01, 시청, 2126)" 
              autocomplete="off" 
              spellcheck="false"
            />
            <button id="clearSearchBtn" class="clear-btn" title="검색어 지우기" aria-label="검색어 초기화">✕</button>
          </div>
          <button class="nav-btn-search" id="btnRouteSearchSubmit" title="검색 실행">
            <span>검색</span>
          </button>
        </div>

        <!-- Autocomplete Dropdown List -->
        <div id="searchDropdown" class="search-dropdown hidden"></div>
      </div>

      <!-- Header Action Controls -->
      <div class="header-actions">
        <button id="btnSettings" class="icon-btn" title="지도 레이어 및 표시 설정" aria-label="설정 메뉴 열기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </button>
      </div>
    </header>

    <!-- Map Settings Floating Modal / Menu -->
    <div id="settingsMenu" class="settings-modal hidden">
      <div class="modal-header">
        <h4>지도 및 표시 설정</h4>
        <button id="closeSettingsBtn" class="close-btn">✕</button>
      </div>
      <div class="menu-section">
        <label class="section-label">배경 지도 (타일 스타일)</label>
        <div class="tile-options">
          <button class="tile-opt active" data-tile="osm">기본 OSM</button>
          <button class="tile-opt" data-tile="carto-light">밝은 지도 (권장)</button>
          <button class="tile-opt" data-tile="carto-dark">다크 모드</button>
          <button class="tile-opt" data-tile="humanitarian">Humanitarian OSM</button>
        </div>
      </div>
      <div class="menu-section">
        <label class="section-label">정류소/경유지 표시</label>
        <label class="checkbox-row">
          <input type="checkbox" id="chkShowStops" checked>
          <span>승하차 정류소 마커 표시</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="chkShowWaypoints" checked>
          <span>교차로 마커 표시 (도로 굴곡 경유점)</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="chkShowLabels">
          <span>주요 정류소명 항상 표시</span>
        </label>
      </div>
      <div class="menu-section">
        <button id="btnExportGeoJSON" class="btn-secondary full-width">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          현재 노선 GeoJSON 다운로드
        </button>
      </div>
    </div>

    <!-- Main Workspace: Map Container + Left Sidebar -->
    <main class="main-content">
      
      <!-- Leaflet Map Container -->
      <div id="map" class="map-container"></div>

      <!-- Floating Map Control Buttons -->
      <div class="map-floating-controls">
        <button id="btnZoomIn" class="map-ctrl-btn" title="확대">+</button>
        <button id="btnZoomOut" class="map-ctrl-btn" title="축소">−</button>
        <button id="btnResetGwangju" class="map-ctrl-btn" title="광주광역시 전체 보기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        <button id="btnFitRoute" class="map-ctrl-btn" title="선택 노선 전체 맞춤">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>

      <!-- Mobile Floating Route Summary Bar -->
      <div id="mobileRouteSheetBar" class="mobile-route-sheet-bar hidden">
        <div class="mrs-info">
          <div class="mrs-texts">
            <div class="mrs-title" id="mrsTitle">순환01A</div>
            <div class="mrs-sub" id="mrsSub">계수초 ⇄ 조선대</div>
          </div>
        </div>
        <button id="btnOpenRouteSheet" class="mrs-open-btn" title="정류소 목록 보기">
          <span>정류소 목록 ▲</span>
        </button>
      </div>

      <!-- Sidebar: Route Detail & Stop Sequence -->
      <aside id="sidebar" class="sidebar">
        
        <!-- Welcome / Route List Panel (Default when no route selected) -->
        <div id="panelRouteList" class="sidebar-panel">
          <div class="panel-header">
            <h3>노선 목록</h3>
            <span class="route-count-badge" id="totalRoutesBadge">113개 노선</span>
          </div>

          <!-- Route Cards List -->
          <div class="route-card-list" id="routeCardList">
            <!-- Dynamically populated via app.js -->
          </div>
        </div>

        <!-- Route Detail & Timeline Panel (When a route is active) -->
        <div id="panelRouteDetail" class="sidebar-panel hidden">
          <div class="route-detail-header">
            <button id="btnBackToList" class="btn-back" title="노선 목록으로 돌아가기">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              <span>목록</span>
            </button>
            <div class="route-title-wrap">
              <h2 id="routeDetailName" class="route-name-lg">순환01A</h2>
            </div>
          </div>

          <!-- Route Key Statistics -->
          <div class="route-stat-card">
            <div class="stat-endpoint-row">
              <div class="endpoint start">
                <span class="point-badge">기점</span>
                <span class="point-name" id="statStartName">세하동</span>
              </div>
              <div class="endpoint-arrow">⇄</div>
              <div class="endpoint turn" id="statTurnWrap">
                <span class="point-badge">회차</span>
                <span class="point-name" id="statTurnName">조선대</span>
              </div>
              <div class="endpoint-arrow">⇄</div>
              <div class="endpoint end">
                <span class="point-badge">종점</span>
                <span class="point-name" id="statEndName">세하동</span>
              </div>
            </div>
            <div class="stat-metrics">
              <div class="metric-item">
                <span class="metric-label">정류소</span>
                <span class="metric-val" id="statStopsCount">0개</span>
              </div>
              <div class="metric-item">
                <span class="metric-label">교차로</span>
                <span class="metric-val" id="statWaypointsCount">0개</span>
              </div>
              <div class="metric-item">
                <span class="metric-label">총 연장</span>
                <span class="metric-val" id="statLength">0.0 km</span>
              </div>
              <div class="metric-item">
                <span class="metric-label">BIS 도로꼭짓점</span>
                <span class="metric-val highlight" id="statVertexCount">0 pt</span>
              </div>
            </div>
          </div>

          <!-- Direction Toggle Tabs -->
          <div class="direction-tabs">
            <button class="dir-tab active" data-dir="all" id="tabDirAll">전체 구간</button>
            <button class="dir-tab" data-dir="상행" id="tabDirUp">상행 (기점→회차)</button>
            <button class="dir-tab" data-dir="하행" id="tabDirDown">하행 (회차→종점)</button>
          </div>

          <!-- Stop Timeline View -->
          <div class="timeline-container" id="timelineContainer">
            <div class="timeline-summary-bar">
              <span id="timelineCountText">정류소 목록</span>
              <span class="hint-text">정류소 클릭 시 지도 이동</span>
            </div>
            <ol class="timeline-list" id="timelineList">
              <!-- Dynamically populated via app.js -->
            </ol>
          </div>
        </div>

      </aside>

      <!-- Sidebar Toggle Floating Button -->
      <button id="btnToggleSidebar" class="sidebar-toggle-btn" title="사이드바 열기/닫기" aria-label="사이드바 토글">
        <svg id="sidebarToggleIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

    </main>

    <!-- Bottom Status Bar -->
    <footer class="bottom-bar">
      <div class="footer-left">
        <span class="data-version-badge">데이터: 2026.10 최신 개편</span>
        <span class="data-source-label">광주시내버스_노선리스트.xlsx 기반 · bus.gwangju.go.kr 도로망 정밀 궤적 100% 매칭</span>
      </div>
      <div class="footer-right">
        <span class="credit-osm">Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</span>
      </div>
    </footer>

  </div>

  <!-- Scripts: Leaflet JS & Data & Application -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Bus Routes & Stops Dataset (113 Routes with Real BIS Vertex Trajectories) -->
  <script src="routes_data.js?v=20261029_v2_new113"></script>
  <!-- Main Application Script (Clean Search-Only, No Path Finding Overhead) -->
  <script src="app.js?v=20261029_v4_perfect"></script>
</body>
</html>
